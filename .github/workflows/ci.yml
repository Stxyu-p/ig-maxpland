name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test suites (phase1-5 modules + round1 invariants on bundle)
        run: npm test
      - name: Rebuild and verify committed bundles match src (drift guard)
        run: |
          node build.js
          git diff --exit-code -- dist/ ig_maxpland_en.user.js
